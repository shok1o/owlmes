<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Защита от чужих скриптов (CSP): только свои файлы, Firebase 10.11.0 (вход по почте) и reCAPTCHA для App Check. Без inline-кода и inline-стилей -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com/firebasejs/10.11.0/ https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self'; img-src 'self' https://www.gstatic.com/recaptcha/ https://www.google.com/recaptcha/; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; object-src 'none'; base-uri 'none'; form-action 'none'">
<script src="/frame-guard.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Owl Messenger</title>
<meta name="theme-color" content="#0b0913">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/action.css?v=1">
</head>
<body>
<main class="card">
  <svg class="owl-art" id="owl" viewBox="0 0 200 190" aria-hidden="true">
    <defs><clipPath id="oc-l"><circle cx="70" cy="96" r="17"/></clipPath><clipPath id="oc-r"><circle cx="130" cy="96" r="17"/></clipPath></defs>
    <g class="owl-head">
      <path class="owl-face" d="M46 30 Q58 46 70 52 Q100 42 130 52 Q142 46 154 30 Q172 62 172 104 Q172 150 136 168 Q100 184 64 168 Q28 150 28 104 Q28 62 46 30 Z"/>
      <circle cx="70" cy="96" r="27" class="owl-iris"/><circle cx="130" cy="96" r="27" class="owl-iris"/>
      <circle cx="70" cy="96" r="17" class="owl-white"/><circle cx="130" cy="96" r="17" class="owl-white"/>
      <g clip-path="url(#oc-l)"><g class="owl-pupil"><circle cx="70" cy="97" r="8.5"/><circle cx="74" cy="92" r="3" class="owl-glint"/></g><rect x="50" y="78" width="40" height="36" class="owl-lid"/></g>
      <g clip-path="url(#oc-r)"><g class="owl-pupil"><circle cx="130" cy="97" r="8.5"/><circle cx="134" cy="92" r="3" class="owl-glint"/></g><rect x="110" y="78" width="40" height="36" class="owl-lid"/></g>
      <path class="owl-beak" d="M90 128 L110 128 L100 145 Z"/>
    </g>
    <path class="owl-wing owl-wing-l" d="M24 190 C18 140 38 92 72 74 C96 84 104 112 98 136 C92 160 64 186 24 190 Z"/>
    <path class="owl-wing owl-wing-r" d="M176 190 C182 140 162 92 128 74 C104 84 96 112 102 136 C108 160 136 186 176 190 Z"/>
  </svg>

  <section id="v-loading">
    <h1>Секундочку…</h1>
    <div class="dots"><i></i><i></i><i></i></div>
  </section>

  <section id="v-reset" hidden>
    <h1>Новый пароль</h1>
    <p>для <b id="reset-email"></b></p>
    <form id="reset-form" novalidate>
      <div class="pw-wrap">
        <input type="password" id="pw" autocomplete="new-password" placeholder="Новый пароль" minlength="6" required>
        <button type="button" class="pw-eye" id="pw-eye" aria-label="Показать пароль"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg></button>
      </div>
      <div class="hint">Минимум 6 символов. Лучше — фраза из нескольких слов.</div>
      <div class="msg" id="reset-msg"></div>
      <button class="btn" id="reset-btn" type="submit">Сохранить пароль</button>
    </form>
  </section>

  <section id="v-done" hidden>
    <div class="badge" id="done-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="done-title"></h1>
    <p id="done-text"></p>
    <a class="btn" href="/">Открыть Owl</a>
  </section>

  <section id="v-error" hidden>
    <div class="badge err"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg></div>
    <h1 id="err-title">Ссылка не сработала</h1>
    <p id="err-text"></p>
    <a class="btn" href="/">Открыть Owl</a>
  </section>

  <div class="foot">Owl Messenger · <a href="/privacy.html">Конфиденциальность</a></div>
</main>

<script type="module" src="/action.js?v=2"></script>
</body>
</html>
