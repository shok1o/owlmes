<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1c">
<meta name="robots" content="noindex">
<title>Киприда — демо</title>
<link rel="icon" href="icon-192.png">
<style>
  /* «Киприда» — демо-версия мессенджера юридического факультета на основе Owl.
     Всё локально: данные заготовлены, ничего не отправляется на сервер. */
  :root {
    --bg-main: #060c1b; --bg-panel: #0c1630; --bg-chat: #08112a; --bg-elev: #13214a;
    --input-bg: #15244c; --border: #1a2b57; --text: #eef3ff; --muted: #8b9cc6;
    --accent: #2f6fe4; --accent-2: #1c48b0; --light: #8fb4ff; --light-soft: rgba(143,180,255,.14); --teacher: #6a7cff;
    --ok: #34c77b; --danger: #ff5b5b;
    --me-bubble: linear-gradient(135deg, #2f6fe4, #1d43a6); --other-bubble: #14224a;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-main); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font: inherit; color: var(--text); }

  /* ===== Каркас ===== */
  #app { display: flex; height: 100dvh; max-width: 1280px; margin: 0 auto; background: var(--bg-panel); }
  @media (min-width: 900px) { #app { height: calc(100dvh - 40px); margin-top: 20px; border-radius: 22px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 30px 80px rgba(0,0,0,.5); } }
  .side { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg-panel); }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-chat); position: relative; }
  @media (max-width: 899px) {
    .side { width: 100%; border-right: none; }
    .main { display: none; }
    #app.chat-open .side { display: none; }
    #app.chat-open .main { display: flex; }
  }

  /* ===== Боковая панель ===== */
  .side-top { padding: calc(14px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand b { font-size: 18px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .demo-badge { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: var(--light); background: var(--light-soft); border: 1px solid rgba(143,180,255,.35); padding: 3px 7px; border-radius: 999px; }
  .me-card { margin: 4px 12px 10px; padding: 12px; border-radius: 16px; background: var(--bg-elev); display: flex; align-items: center; gap: 12px; }
  .me-card .who { flex: 1; min-width: 0; }
  .me-card .who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-card .who span { font-size: 12px; color: var(--muted); }
  .role-switch { margin: 0 12px 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--input-bg); border-radius: 12px; padding: 3px; }
  .role-switch button { padding: 8px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
  .role-switch button.on { background: var(--accent); color: #fff; }
  .role-hint { margin: -4px 14px 10px; font-size: 11px; color: var(--muted); text-align: center; }
  .search { margin: 0 12px 8px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: none; background: var(--input-bg); outline: none; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .sec { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin: 14px 10px 6px; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; cursor: pointer; transition: background .15s; }
  .chat-item:hover { background: rgba(255,255,255,.03); }
  .chat-item.active { background: var(--bg-elev); }
  .chat-item .ci-body { flex: 1; min-width: 0; }
  .chat-item .ci-name { display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 15px; }
  .chat-item .ci-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .ci-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .chat-item .ci-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; color: var(--muted); }
  .unread { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .lock-card { margin: 8px 4px 4px; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, #13244f, #0e1a3c); border: 1px dashed rgba(143,180,255,.35); }
  .lock-card b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .lock-card p { margin: 6px 0 10px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .role-pick .wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 12px; padding: 14px 10px; }
  .role-pick .wide span { display: flex; flex-direction: column; align-items: flex-start; }
  .side-foot { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .side-foot button { color: var(--muted); text-decoration: underline; font-size: 11px; }

  /* ===== Аватары и значки ===== */
  .av { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; }
  .av.sm { width: 34px; height: 34px; font-size: 13px; }
  .av.ai { background: radial-gradient(circle at 30% 25%, #2a4fae, #0f1f4d); border: 1.5px solid rgba(143,180,255,.6); }
  .av.ch { background: linear-gradient(135deg, #1d3f9a, #0f2560); }
  .av.dean { background: linear-gradient(135deg, #3b4f96, #1d2b63); }
  .av.grp { background: linear-gradient(135deg, #2b6a8f, #173d5e); }
  .tick { display: inline-flex; flex-shrink: 0; }
  .role-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; letter-spacing: .3px; }
  .role-tag.t { color: #b7c0ff; background: rgba(106,124,255,.18); }
  .role-tag.s { color: #7fb0ff; background: rgba(47,111,228,.16); }

  /* ===== Чат ===== */
  .chat-head { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 10px; background: var(--bg-panel); border-bottom: 1px solid var(--border); min-height: 64px; }
  .back { display: none; padding: 6px; border-radius: 10px; }
  @media (max-width: 899px) { .back { display: inline-flex; } }
  .chat-head .ch-title { flex: 1; min-width: 0; }
  .chat-head .ch-title b { display: flex; align-items: center; gap: 6px; font-size: 16px; }
  .chat-head .ch-title b span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-head .ch-title small { font-size: 12px; color: var(--muted); display: block; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: var(--input-bg); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .head-btn:hover { background: var(--bg-elev); }
  .msgs { flex: 1; overflow-y: auto; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 6px;
          background-image: radial-gradient(rgba(140,170,255,.07) 1px, transparent 1px); background-size: 26px 26px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: rgba(12,22,48,.85); padding: 4px 10px; border-radius: 10px; margin: 8px 0; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; animation: in .25s ease both; }
  .row.me { justify-content: flex-end; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .row, .typing i { animation: none !important; } }
  .bubble { max-width: min(560px, 78%); padding: 9px 13px 7px; border-radius: var(--radius); background: var(--other-bubble); line-height: 1.42; font-size: 15px; word-wrap: break-word; position: relative; }
  .row.me .bubble { background: var(--me-bubble); border-bottom-right-radius: 6px; }
  .row:not(.me) .bubble { border-bottom-left-radius: 6px; }
  .bubble .from { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; color: #9cc0ff; }
  .bubble .time { font-size: 11px; color: rgba(238,243,255,.55); float: right; margin: 6px 0 0 10px; }
  .bubble p { margin: 0 0 6px; } .bubble p:last-of-type { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 6px; padding-left: 20px; } .bubble li { margin: 2px 0; }
  .bubble.ai { background: linear-gradient(180deg, #13244f, #101d40); border: 1px solid rgba(143,180,255,.22); max-width: min(620px, 86%); }
  .bubble.ai .from { color: var(--light); }
  .bubble.private { border: 1px dashed rgba(143,180,255,.5); }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .src { font-size: 12px; padding: 4px 9px; border-radius: 8px; background: rgba(143,180,255,.12); color: #cfe0ff; border: 1px solid rgba(143,180,255,.25); }
  .disclaimer { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .seen { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 5px; }
  .announce { border-left: 3px solid var(--light); }
  .task { margin-top: 8px; padding: 12px; border-radius: 14px; background: rgba(6,12,27,.45); border: 1px solid var(--border); }
  .task .t-head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .task .due { margin-left: auto; font-size: 12px; font-weight: 600; color: #ff9d9d; background: rgba(255,91,91,.13); padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .task .t-body { font-size: 14px; color: #cdd8f5; margin: 8px 0 10px; }
  .task .t-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { padding: 9px 14px; border-radius: 11px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
  .btn.primary { background: var(--accent); color: #fff; } .btn.primary:hover { background: #3a7cf2; }
  .btn.ghost { background: var(--input-bg); } .btn.ghost:hover { background: var(--bg-elev); }
  .btn.soft { background: var(--light-soft); color: var(--light); border: 1px solid rgba(143,180,255,.35); }
  .btn.done { background: rgba(52,199,123,.14); color: var(--ok); cursor: default; }
  .progress { height: 6px; border-radius: 3px; background: var(--input-bg); overflow: hidden; margin: 2px 0 10px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #5f95ff); border-radius: 3px; transition: width .4s; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 8px 12px; border-radius: 999px; background: var(--input-bg); border: 1px solid var(--border); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .chip:hover { border-color: rgba(143,180,255,.5); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--light); opacity: .4; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: 1; } }

  /* ===== Поле ввода ===== */
  .composer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; background: var(--bg-panel); border-top: 1px solid var(--border); }
  .composer textarea { flex: 1; resize: none; border: none; outline: none; background: var(--input-bg); border-radius: 20px; padding: 11px 16px; max-height: 120px; line-height: 1.35; }
  .send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .readonly { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .readonly span { flex: 1; }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 30px; }
  .empty svg { opacity: .9; margin-bottom: 12px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

  /* ===== Вход и проверка ===== */
  #onb { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px;
         background: radial-gradient(120% 80% at 50% 0%, #15306e 0%, #060c1b 60%); overflow-y: auto; }
  #onb[hidden] { display: none; }
  .onb-card { width: 100%; max-width: 420px; background: rgba(12,22,48,.92); border: 1px solid var(--border); border-radius: 24px; padding: 28px 24px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .onb-card h1 { font-size: 24px; margin: 10px 0 6px; }
  .onb-card p.lead { color: var(--muted); margin: 0 0 20px; line-height: 1.45; font-size: 15px; }
  .feat { text-align: left; display: grid; gap: 10px; margin: 0 0 22px; }
  .feat div { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #cdd8f5; line-height: 1.35; }
  .feat div i { font-style: normal; flex-shrink: 0; width: 28px; height: 28px; border-radius: 9px; background: var(--input-bg); display: inline-flex; align-items: center; justify-content: center; }
  .big { width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px; margin-top: 8px; }
  .role-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
  .role-pick button { padding: 18px 10px; border-radius: 16px; background: var(--input-bg); border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 600; }
  .role-pick button small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .role-pick button:hover { border-color: var(--accent); }
  .field { text-align: left; margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px 4px; }
  .field input, .field select { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); outline: none; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 12px; display: flex; gap: 8px; text-align: left; }
  .steps { text-align: left; display: grid; gap: 12px; margin: 18px 0 6px; }
  .step { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); transition: color .3s; }
  .step .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .3s; }
  .step.on { color: var(--text); } .step.on .dot { border-color: var(--accent); }
  .step.ok { color: var(--text); } .step.ok .dot { background: var(--ok); border-color: var(--ok); }
  .linkish { color: var(--muted); font-size: 13px; text-decoration: underline; margin-top: 14px; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); background: #1b2d5e; color: var(--text); padding: 11px 16px; border-radius: 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; transition: all .25s; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Мой слонёнок */
  .pet { flex: 1; overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; background: var(--bg-chat); }
  .pet-hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pet-hero .m { animation: petFloat 3.2s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(47,111,228,.35)); }
  .pet-hero.lvlup .m { animation: petUp .9s ease-out; }
  .pet-hero .m { cursor: pointer; } .pet-hero .m svg { display: block; transition: width .9s cubic-bezier(.3,1.6,.5,1), height .9s cubic-bezier(.3,1.6,.5,1), transform .25s ease-out, filter .25s ease-out; }
  .pet-hero .m.poke { animation: petHop .5s ease-out; }
  .pet-hero svg .earL, .pet-hero svg .earR, .pet-hero svg .eyes, .pet-hero svg .tassel { transform-box: view-box; }
  .pet-hero svg .earL { transform-origin: 20px 30px; animation: earL 2.6s ease-in-out infinite; }
  .pet-hero svg .earR { transform-origin: 44px 30px; animation: earR 2.6s ease-in-out infinite; }
  .pet-hero svg .eyes { transform-origin: 32px 28.5px; animation: blink 4.5s infinite; }
  .pet-hero svg .tassel { transform-origin: 32px 9.8px; animation: tassel 2.6s ease-in-out infinite; }
  .pet-stage { font-size: 12px; color: var(--muted); }
  .pet-hero.is3d .m { width: 320px; max-width: 100%; height: 270px; animation: none; filter: none; cursor: grab; }
  .pet-hero.is3d .m canvas { display: block; } .pet-hero.is3d .pet-shadow { display: none; }
  @keyframes earL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-9deg); } }
  @keyframes earR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(9deg); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes tassel { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-6deg); } }
  @keyframes petHop { 0% { transform: translateY(0); } 35% { transform: translateY(-22px) scale(1.04, .96); } 70% { transform: translateY(0) scale(1.06, .94); } 100% { transform: none; } }
  @keyframes petFloat { 0%,100% { transform: perspective(400px) translateY(0) rotateY(-12deg); } 50% { transform: perspective(400px) translateY(-8px) rotateY(12deg); } }
  .pet-hero .m svg { transform: perspective(400px) rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); filter: drop-shadow(var(--sx, 0px) 10px 12px rgba(0,0,0,.45)) brightness(var(--br, 1)); }
  .pet-shadow { width: 70px; height: 10px; margin-top: -4px; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.55), transparent 70%); animation: petShadow 3.2s ease-in-out infinite; }
  @keyframes petShadow { 0%,100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.75); opacity: .55; } }
  @keyframes petUp { 0% { transform: scale(1); } 40% { transform: scale(1.18) translateY(-10px); filter: drop-shadow(0 0 26px rgba(143,180,255,.9)); } 100% { transform: scale(1); } }
  .pet-lvl { font-size: 18px; font-weight: 700; } .pet-rank { color: var(--light); font-size: 14px; }
  .pet-card { width: 100%; max-width: 440px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .pet-bar { height: 10px; border-radius: 6px; background: var(--input-bg); overflow: hidden; margin: 8px 0 6px; }
  .pet-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--light)); border-radius: 6px; transition: width .6s ease; }
  .pet-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .pet-awards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .pet-award { text-align: center; font-size: 11.5px; padding: 10px 4px; border-radius: 12px; background: var(--light-soft); border: 1px solid rgba(143,180,255,.35); }
  .pet-award b { display: block; font-size: 24px; margin-bottom: 4px; }
  .pet-award.locked { background: var(--input-bg); border-color: var(--border); color: var(--muted); }
  .pet-award.locked b { opacity: .35; } .pet-award .lk { display: inline-flex; vertical-align: -2px; } .pet-award .lk svg { width: 12px; height: 12px; }
  .pet-q { font-size: 15px; line-height: 1.45; margin: 6px 0 10px; }
  .pet-opt { width: 100%; text-align: left; padding: 11px 13px; border-radius: 12px; background: var(--input-bg); border: 1px solid var(--border); margin-top: 8px; font-size: 14px; }
  .pet-opt:hover:not(:disabled) { background: var(--bg-elev); }
  .pet-opt.right { border-color: var(--ok); background: rgba(52,199,123,.14); } .pet-opt.wrong { border-color: var(--danger); background: rgba(255,91,91,.12); }
  .pet-why { margin-top: 12px; font-size: 13.5px; line-height: 1.5; color: var(--text); } .pet-why p { margin: 0 0 8px; }
  .pet-note { font-size: 12px; color: var(--muted); }

  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "input") { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px"; }
    if (e.target.id === "search") renderList();
  });

  // ===== Вход: выбор роли → данные → проверка по списку вуза =====
  const card = $("#onb-card");
  function onbWelcome() {
    card.innerHTML = `${MASCOT(76)}<h1>Киприда</h1><p class="lead">Мессенджер РГУП: для всех — и с университетским разделом для студентов и преподавателей</p>
      <div class="feat">
        <div><i>${SCALES(16)}</i><span><b>Каналы курсов</b> — объявления, задания и сдача работ без потерянных сообщений</span></div>
        <div><i>${MASCOT(18)}</i><span><b>Кипа</b> — объясняет нормы и помогает с казусами, всегда со ссылкой на статью</span></div>
        <div><i>${TICK("#6a7cff", 16)}</i><span><b>Выбор за вами</b> — обычный мессенджер доступен всем, а университетский раздел открывается после подтверждения статуса</span></div>
      </div>
      <button class="big btn primary" data-onb="role" style="justify-content:center">Войти</button>
      <button class="linkish" data-onb="skip">Пропустить — сразу к демо</button>`;
  }
  function onbRole(verifyOnly = false) {
    card.innerHTML = `${MASCOT(56)}<h1>${verifyOnly ? "Подтвердить статус" : "Как будете пользоваться?"}</h1><p class="lead">${verifyOnly ? "Откроются каналы курсов, беседа группы, преподаватели и «Кипа»" : "Обычный мессенджер доступен всем. Статус студента или сотрудника открывает университетский раздел — его можно подтвердить и позже"}</p>
      <div class="role-pick">${verifyOnly ? "" : `<button class="wide" data-onb="guest">${I.lock.replace('width="16" height="16"', 'width="26" height="26"')}<span>Просто общаться<small>регистрация по почте, без статуса</small></span></button>`}<button data-onb="form" data-r="student">${I.student}Студент<small>по студбилету</small></button><button data-onb="form" data-r="teacher">${I.teacher}Преподаватель<small>по документу сотрудника</small></button></div>`;
  }
  function onbForm(r) {
    role = r;
    const st = r === "student";
    card.innerHTML = `${MASCOT(56)}<h1>${st ? "Студенческий билет" : "Документ сотрудника"}</h1><p class="lead">Сверим данные со списком ${st ? "деканата" : "отдела кадров"} — это займёт пару секунд</p>
      <div class="field"><label>Вуз</label><select><option>РГУП им. В.М. Лебедева (демо)</option></select></div>
      <div class="field"><label>ФИО</label><input value="${esc(PEOPLE[r].name)}"></div>
      <div class="field"><label>${st ? "Номер студенческого билета" : "Табельный номер"}</label><input value="${st ? "ЮР-2025-01843" : "Т-00417"}" inputmode="text"></div>
      <button class="big btn primary" data-onb="check" style="justify-content:center">Проверить и войти</button>
      <div class="note">${I.lock}<span>Мы <b>не храним</b> фото и сканы документов: номер только сверяется со списком вуза, после этого остаётся лишь отметка «подтверждён».</span></div>`;
  }
  function onbGuest() {
    card.innerHTML = `${MASCOT(56)}<h1>Обычный аккаунт</h1><p class="lead">Переписка с друзьями, открытые каналы и бесплатная юридическая клиника</p>
      <div class="field"><label>Имя</label><input value="Анна Смирнова"></div>
      <div class="field"><label>Почта</label><input type="email" value="anna.com"></div>
      <button class="big btn primary" data-onb="enterGuest" style="justify-content:center">Создать аккаунт</button>
      <div class="note">${I.lock}<span>Статус студента или сотрудника можно подтвердить позже — в любой момент, прямо в приложении.</span></div>`;
  }
  function onbCheck() {
    const st = role === "student";
    card.innerHTML = `${MASCOT(56)}<h1>Проверяем…</h1>
      <div class="steps">
        <div class="step" id="s1"><span class="dot"></span>Ищем номер в списке ${st ? "деканата" : "сотрудников"}</div>
        <div class="step" id="s2"><span class="dot"></span>${st ? "Группа ЮР-201, 2 курс" : "Кафедра гражданского права"}</div>
        <div class="step" id="s3"><span class="dot"></span>Документы не сохраняются</div>
      </div>`;
    const ids = ["s1", "s2", "s3"]; let i = 0;
    const tick = () => {
      if (i > 0) { const p = $("#" + ids[i - 1]); p.classList.remove("on"); p.classList.add("ok"); p.querySelector(".dot").innerHTML = I.check; }
      if (i < ids.length) { $("#" + ids[i]).classList.add("on"); i++; setTimeout(tick, reduce ? 80 : 750); }
      else setTimeout(onbDone, reduce ? 80 : 500);
    };
    tick();
  }
  function onbDone() {
    const p = PEOPLE[role];
    card.innerHTML = `${MASCOT(76)}<h1 style="display:flex;align-items:center;justify-content:center;gap:8px">Подтверждено ${TICK(role === "teacher" ? "#6a7cff" : "#2f6fe4", 24)}</h1>
      <p class="lead">${esc(p.name)}<br>${esc(p.sub)}</p>
      <button class="big btn primary" data-onb="enter" style="justify-content:center">Открыть «Киприду»</button>`;
  }
  function enterApp() { $("#onb").hidden = true; setRole(role); if (matchMedia("(min-width: 900px)").matches) openChat(role === "teacher" ? "civ" : role === "student" ? "ai" : "clinic"); }
  card.addEventListener("click", (e) => {
    const b = e.target.closest("[data-onb]"); if (!b) return;
    ({ role: () => onbRole(), guest: onbGuest, enterGuest: () => { role = "guest"; enterApp(); }, form: () => onbForm(b.dataset.r), check: onbCheck, enter: enterApp, skip: enterApp })[b.dataset.onb]();
  });
  $("#restart").addEventListener("click", () => { $("#onb").hidden = false; onbWelcome(); });

  onbWelcome();
  renderMe(); renderList();
})();
</script>
</body>
</html>
